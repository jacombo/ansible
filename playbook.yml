---
- name: "Install base packages and configure unattended-upgrades, automatic reboots, and {{ swap_file_size_gb }}GB swap"
  hosts: all
  become: true

  vars:
    swap_file_path: /swapfile
    swap_file_size_gb: 16
    vm_swappiness: "10"
    unattended_upgrade_boot_flags: "-d -v"
    install_docker: true
    install_stremio: false

  tasks:
    # --- Base Packages & Unattended Upgrades ---
    - name: Update APT cache and install basic tools and unattended-upgrades
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - iproute2
          - vim
          - nano
          - net-tools
          - mc
          - bsdextrautils
          - ansible
          - openssh-client
          - sshpass
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
      when: install_docker | bool

    # --- Stremio Installation ---
    - name: Install Stremio via Flatpak
      when: install_stremio | bool
      block:
        - name: Ensure Flatpak is installed
          ansible.builtin.apt:
            name: flatpak
            state: present

        - name: Add Flathub remote repository
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
            method: system

        - name: Install Stremio Flatpak
          community.general.flatpak:
            name: com.stremio.Stremio
            state: present
            remote: flathub
            method: system

    - name: Pre-seed debconf to enable unattended-upgrades automatically
      ansible.builtin.debconf:
        name: unattended-upgrades
        question: unattended-upgrades/enable_auto_updates
        value: "true"
        vtype: boolean
      register: debconf_unattended

    - name: Reconfigure unattended-upgrades non-interactively
      ansible.builtin.command:
        cmd: dpkg-reconfigure -f noninteractive unattended-upgrades
      when: debconf_unattended.changed
      changed_when: true

    - name: Configure automatic reboot and reboot time in 50unattended-upgrades
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - regexp: '^(//)?Unattended-Upgrade::Automatic-Reboot\s+'
          line: 'Unattended-Upgrade::Automatic-Reboot "true";'
        - regexp: '^(//)?Unattended-Upgrade::Automatic-Reboot-Time\s+'
          line: 'Unattended-Upgrade::Automatic-Reboot-Time "02:00";'
      notify: Restart unattended-upgrades

    - name: Deploy unattended-upgrade-boot systemd service from template
      ansible.builtin.template:
        src: templates/unattended-upgrade-boot.service.j2
        dest: /etc/systemd/system/unattended-upgrade-boot.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd daemon

    - name: Enable unattended-upgrade-boot service on startup
      ansible.builtin.systemd:
        name: unattended-upgrade-boot.service
        enabled: true
        daemon_reload: true

    - name: Enable and start unattended-upgrades service and APT timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - unattended-upgrades.service
        - apt-daily.timer
        - apt-daily-upgrade.timer

    # --- Swap Configuration ---
    - name: Check active swap size with swapon
      ansible.builtin.command:
        cmd: swapon --show=SIZE --noheadings --bytes
      register: swapon_output
      changed_when: false

    - name: Calculate active swap size in GB
      ansible.builtin.set_fact:
        current_swap_gb: "{{ ((swapon_output.stdout_lines | default([]) | map('int') | sum) / 1024 / 1024 / 1024) | round(1) }}"

    - name: Create and configure swapfile
      when: (current_swap_gb | default(0) | float) < (swap_file_size_gb | float)
      block:
        - name: Create swapfile
          ansible.builtin.command:
            cmd: "fallocate -l {{ swap_file_size_gb }}G {{ swap_file_path }}"
            creates: "{{ swap_file_path }}"

        - name: Set secure permissions (0600) on swapfile
          ansible.builtin.file:
            path: "{{ swap_file_path }}"
            owner: root
            group: root
            mode: "0600"

        - name: Format swapfile
          ansible.builtin.command:
            cmd: "mkswap {{ swap_file_path }}"
          register: mkswap_result
          changed_when: "'Setting up swapspace' in mkswap_result.stdout"

        - name: Enable swapfile immediately
          ansible.builtin.command:
            cmd: "swapon {{ swap_file_path }}"
          changed_when: true

        - name: Ensure swapfile is mounted permanently in /etc/fstab
          ansible.posix.mount:
            name: none
            src: "{{ swap_file_path }}"
            fstype: swap
            opts: sw
            passno: "0"
            dump: "0"
            state: present

    - name: Set vm.swappiness to 10 immediately and persist in /etc/sysctl.conf
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ vm_swappiness }}"
        state: present
        reload: true

    # --- Mounts Configuration ---
    - name: Copy tmp.mount unit file to /etc/systemd/system/
      ansible.builtin.shell: |
        if [ -f /usr/share/systemd/tmp.mount ]; then
          cp /usr/share/systemd/tmp.mount /etc/systemd/system/tmp.mount
        elif [ -f /usr/lib/systemd/system/tmp.mount ]; then
          cp /usr/lib/systemd/system/tmp.mount /etc/systemd/system/tmp.mount
        elif [ -f /lib/systemd/system/tmp.mount ]; then
          cp /lib/systemd/system/tmp.mount /etc/systemd/system/tmp.mount
        fi
      args:
        creates: /etc/systemd/system/tmp.mount

    - name: Enable and start tmp.mount
      ansible.builtin.systemd:
        name: tmp.mount
        daemon_reload: true
        enabled: true
        state: started

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades.service
        state: restarted
